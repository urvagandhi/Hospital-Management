# TD-024 / SEC-019 — verify package-lock.json integrity on every PR.
# `npm ci` fails fast if package.json and package-lock.json drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (npm ci + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test --if-present

  frontend:
    name: Frontend (npm ci + lint + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `lint` script is a phantom (no eslint dep, no config) — re-enable once
      # eslint + @typescript-eslint are added as devDeps and an .eslintrc lands.
      - run: npm run type-check
      - run: npm run build
