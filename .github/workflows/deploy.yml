name: Auto Deploy to Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            echo "Starting deployment..."

            cd /root/Hospital-Management

            echo "Fetching latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Building and restarting containers..."
            docker compose up -d --build

            echo "Cleaning unused Docker images..."
            docker image prune -af

            echo "Deployment complete."

            echo "Verifying deployment health..."
            # Wait for backend to be healthy (hospital-management-backend-1)
            for i in {1..10}; do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' hospital-management-backend-1 2>/dev/null || echo "not found")
              if [ "$STATUS" == "healthy" ]; then
                echo "✅ Backend is healthy!"
                break
              fi
              echo "Waiting for healthcheck... ($i/10) - Current status: $STATUS"
              sleep 5
              if [ $i -eq 10 ]; then
                echo "❌ Backend failed to become healthy in time"
                docker compose logs backend
                exit 1
              fi
            done

            # Final direct API check (follows redirect to HTTPS and ignores SSL errors for localhost)
            echo "Direct API health check:"
            curl -kL -f http://localhost/api/health

            echo "Container status:"
            docker ps
