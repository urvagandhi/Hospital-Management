name: Keep Server Alive

on:
  schedule:
    - cron: "*/7 * * * *" # every 7 minutes
  workflow_dispatch: # allow manual trigger

jobs:
  ping-health:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 30 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 20 \
            --retry-all-errors \
            https://hospital-management-8lbf.onrender.com/api/health)
          echo "Health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Server returned $STATUS — may be cold starting"
          fi

  demo-login:
    name: Demo Account Warm-up Login
    runs-on: ubuntu-latest
    needs: ping-health
    steps:
      - name: Step 1 — Password login
        id: login
        run: |
          # Write response to file — avoids shell variable issues with large payloads (logoUrl is a huge base64)
          curl -s -X POST \
            --connect-timeout 30 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 20 \
            --retry-all-errors \
            -o /tmp/login_resp.json \
            https://hospital-management-8lbf.onrender.com/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"urvagandhi24@gmail.com","password":"Test@1234"}'

          # Log only non-sensitive fields (skip the huge logoUrl)
          echo "success=$(jq -r '.success' /tmp/login_resp.json)"
          echo "requireAuthCode=$(jq -r '.requireAuthCode' /tmp/login_resp.json)"
          echo "message=$(jq -r '.message' /tmp/login_resp.json)"

          TOKEN=$(jq -r '.data.tempToken // empty' /tmp/login_resp.json)
          if [ -z "$TOKEN" ]; then
            echo "::warning:: No token received — login step 1 failed (credentials may have changed or server is cold starting)"
            exit 0
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Step 2 — Verify auth code
        if: steps.login.outputs.token != ''
        run: |
          curl -s -X POST \
            --connect-timeout 30 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 20 \
            --retry-all-errors \
            -o /tmp/auth_resp.json \
            https://hospital-management-8lbf.onrender.com/api/auth/login/verify-auth-code \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.login.outputs.token }}" \
            -d '{"authCode":"136960"}'

          echo "success=$(jq -r '.success' /tmp/auth_resp.json)"
          echo "message=$(jq -r '.message' /tmp/auth_resp.json)"

          SUCCESS=$(jq -r '.success // empty' /tmp/auth_resp.json)
          if [ "$SUCCESS" != "true" ]; then
            echo "::warning:: Auth code verification failed (dynamic 2FA code may have rotated)"
            exit 0
          fi
          echo "Demo login completed successfully"
