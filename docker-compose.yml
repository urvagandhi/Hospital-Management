version: "3.8"

services:


  # ── Compression Service (Python) ──
  compression-service:
    build:
      context: ./compression-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8000
      - INTERNAL_API_SECRET=${COMPRESSION_SERVICE_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@host.docker.internal:27017/hospital-management?authSource=admin
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Backend (Node/Express API) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@host.docker.internal:27017/hospital-management?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@host.docker.internal:6379
      COMPRESSION_SERVICE_URL: http://compression-service:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    depends_on:
      compression-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (React/Vite → Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* vars are baked in at build time
        VITE_API_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME:-MediVault}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  # redis_data:
