services:
  # ── Compression Service (Python) ──
  compression-service:
    build:
      context: ./compression-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8000
      - INTERNAL_API_SECRET=${COMPRESSION_SERVICE_SECRET}
      # Cloudinary (legacy / fallback) — uncomment to re-enable
      # - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      # - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      # - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_ACCESS_KEY_ID=${DO_SPACES_ACCESS_KEY_ID}
      - DO_SPACES_SECRET_ACCESS_KEY=${DO_SPACES_SECRET_ACCESS_KEY}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_REGION=${DO_SPACES_REGION}
      - USE_DIGITALOCEAN_AS_PRIMARY=${USE_DIGITALOCEAN_AS_PRIMARY:-false}
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@host.docker.internal:27017/hospital-management?authSource=admin
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Backend (Node/Express API) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@host.docker.internal:27017/hospital-management?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@host.docker.internal:6379
      COMPRESSION_SERVICE_URL: http://compression-service:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Port 5000 not mapped publicly — frontend nginx proxies /api → backend:5000 over the compose network
    depends_on:
      compression-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ── Frontend (React/Vite → Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* vars are baked in at build time
        VITE_API_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME:-MyMediVault}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      certbot:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Certbot (Let's Encrypt renewal sidecar) ──
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
