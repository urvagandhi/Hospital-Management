services:
  # ── Compression Service (Python) ──
  compression-service:
    build:
      context: ./compression-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # Resource ceilings tuned for the 2 vCPU / 2 GB droplet shared with
    # host-level MongoDB (~400 MB) + Redis (~100 MB) + backend (~350 MB)
    # + nginx (~50 MB). Sidecar gets the largest slice because each CPU
    # pool worker peaks ~400 MB during PIL rasterisation; with 2 workers
    # the peak is ~900 MB. mem_limit caps it so an OOM event kills only
    # the sidecar (which auto-restarts) instead of the kernel choosing
    # MongoDB. Tune ADMISSION_CAPACITY in lockstep with cpus.
    mem_limit: 1200m
    mem_reservation: 600m
    cpus: 1.5
    environment:
      - PORT=8000
      - INTERNAL_API_SECRET=${COMPRESSION_SERVICE_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # DigitalOcean Spaces (pass through if used)
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_ACCESS_KEY_ID=${DO_SPACES_ACCESS_KEY_ID}
      - DO_SPACES_SECRET_ACCESS_KEY=${DO_SPACES_SECRET_ACCESS_KEY}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_REGION=${DO_SPACES_REGION}
      - USE_DIGITALOCEAN_AS_PRIMARY=${USE_DIGITALOCEAN_AS_PRIMARY}
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@host.docker.internal:27017/hospital-management?authSource=admin
      # Concurrent CPU jobs admitted before sidecar returns 503 Busy.
      # Must be <= cpus above (one CPU pool worker per concurrent job).
      - ADMISSION_CAPACITY=${COMPRESSION_ADMISSION_CAPACITY:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ── Backend (Node/Express API) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 450m
    mem_reservation: 250m
    cpus: 0.75
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: https://mymedivault.in,https://www.mymedivault.in
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@host.docker.internal:27017/hospital-management?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@host.docker.internal:6379
      COMPRESSION_SERVICE_URL: http://compression-service:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Port 5000 removed from public mapping for production hardening
    depends_on:
      compression-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ── Frontend (React/Vite → Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* vars are baked in at build time
        VITE_API_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME:-MyMediVault}
    restart: unless-stopped
    mem_limit: 100m
    cpus: 0.25
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/letsencrypt/webroot:/var/www/certbot:rw
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "https://localhost/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
