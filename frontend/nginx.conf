server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name mymedivault.in www.mymedivault.in;

    # Allow certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    http2 on;

    server_name mymedivault.in www.mymedivault.in;

    ssl_certificate     /etc/letsencrypt/live/mymedivault.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mymedivault.in/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # Allow certbot challenge (for HTTPS renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:5000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 320s;
    }

    # Static assets
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif|wasm|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
}
