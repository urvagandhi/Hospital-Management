# ─────────────────────────────────────────────────────────────────────────────
# MediVault — edge nginx
#   - Serves the built React SPA at /
#   - Reverse-proxies /api/ to the backend container (Docker DNS: backend:5000)
#   - Lightweight /healthz for liveness probes (no DB hit)
#
# This config listens on HTTP/80 only. HTTPS (443) is added by certbot in a
# follow-up step on the droplet — see README's "Step 8 — DNS + HTTPS".
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Patient uploads cap at 100 MB on the backend; nginx must allow at least that
    client_max_body_size 100M;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # ── Baseline security headers (SPA HTML) ────────────────────────────────
    # CSP intentionally NOT set here — Helmet on the backend owns API responses;
    # tightening CSP for the SPA needs a per-route audit (Cloudinary, FCM, etc.)
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ── Liveness probe ──────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── /api/ → backend ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Future-proof for WebSocket upgrades; harmless for plain HTTP today
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Long-running export/compression endpoints can run up to 5 minutes
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    320s;   # > sidecar's 300s pipeline ceiling
    }

    # ── Long-cache static assets (Vite emits hashed filenames) ──────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif|wasm|map)$ {
        expires      1y;
        add_header   Cache-Control "public, immutable";
        access_log   off;
        try_files    $uri =404;
    }

    # ── SPA fallback — serve index.html for any client-side route ───────────
    location / {
        # index.html itself must NEVER be cached, otherwise stale shells
        # keep loading old JS bundles after a deploy
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        try_files $uri $uri/ /index.html;
    }

    # ── Hide internals ──────────────────────────────────────────────────────
    server_tokens off;
    location ~ /\.(?!well-known).* { deny all; }
}
