plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.hospital.management'
    compileSdk 35

    defaultConfig {
        applicationId "com.hospital.management"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // TD-A05 (2026-04-25): BASE_URL is a build variable so staging/prod
        // can switch hosts without a source edit. Override per buildType
        // below. Reachable as `BuildConfig.BASE_URL` in Kotlin.
        buildConfigField "String", "BASE_URL", "\"https://hospital-management-8lbf.onrender.com\""
        buildConfigField "String", "STORAGE_PROVIDER", "\"cloudinary\""
        buildConfigField "int", "MAX_UPLOAD_SIZE_MB", "20"
        buildConfigField "int", "MAX_SCAN_PAGES", "20"
    }

    // TD-A01 (2026-04-25): release signing reads from env vars (or
    // ~/.gradle/gradle.properties). The repo no longer carries credentials
    // or a keystore. See android-app/KEYSTORE_SETUP.md for the generation
    // + verification runbook.
    //
    //   Env vars (preferred for CI):
    //     HMS_UPLOAD_KEYSTORE_PATH   absolute path to .jks
    //     HMS_UPLOAD_KEYSTORE_PWD    keystore password
    //     HMS_UPLOAD_KEY_PWD         key (alias) password
    //
    //   Or in ~/.gradle/gradle.properties (preferred for local dev):
    //     hmsUploadKeystorePath=/absolute/path/hms-upload.jks
    //     hmsUploadKeystorePwd=...
    //     hmsUploadKeyPwd=...
    //
    // assembleRelease fails loudly if neither source is set.
    signingConfigs {
        release {
            def keystorePath = System.getenv("HMS_UPLOAD_KEYSTORE_PATH")
                ?: project.findProperty("hmsUploadKeystorePath")
            def keystorePwd = System.getenv("HMS_UPLOAD_KEYSTORE_PWD")
                ?: project.findProperty("hmsUploadKeystorePwd")
            def keyPwd = System.getenv("HMS_UPLOAD_KEY_PWD")
                ?: project.findProperty("hmsUploadKeyPwd")

            if (keystorePath && keystorePwd && keyPwd) {
                storeFile     file(keystorePath)
                storePassword keystorePwd
                keyAlias      "hms-upload"
                keyPassword   keyPwd
            }
            // If unset, this signingConfig has no storeFile. Gradle will
            // refuse `assembleRelease` with a clear "keystore not specified"
            // error — see KEYSTORE_SETUP.md.
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Production hits the live host and uses DigitalOcean Spaces.
            buildConfigField "String", "BASE_URL", "\"https://mymedivault.in\""
            buildConfigField "String", "STORAGE_PROVIDER", "\"digitalocean\""
            buildConfigField "int", "MAX_UPLOAD_SIZE_MB", "100"
            buildConfigField "int", "MAX_SCAN_PAGES", "30"
        }
        debug {
            // Debug builds hit the Render staging environment and use Cloudinary.
            buildConfigField "String", "BASE_URL", "\"https://hospital-management-8lbf.onrender.com\""
            buildConfigField "String", "STORAGE_PROVIDER", "\"cloudinary\""
            buildConfigField "int", "MAX_UPLOAD_SIZE_MB", "10"
            buildConfigField "int", "MAX_SCAN_PAGES", "20"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    // Security
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.biometric:biometric:1.1.0"


    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'

    // ML Kit Document Scanner
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"


    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'


    // Firebase BoM (32.x — last version compatible with Kotlin 1.9)
    implementation platform('com.google.firebase:firebase-bom:32.8.1')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Room Database (TD-A04 2026-04-25: kapt → KSP)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
}
