plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.hospital.management'
    compileSdk 35

    defaultConfig {
        applicationId "com.hospital.management"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // TD-A05 (2026-04-25): BASE_URL is a build variable so staging/prod
        // can switch hosts without a source edit. Override per buildType
        // below. Reachable as `BuildConfig.BASE_URL` in Kotlin.
        buildConfigField "String", "BASE_URL", "\"https://hospital-management-8lbf.onrender.com\""
    }

    // TD-A01 (2026-04-25): release signing reads from env vars (or
    // ~/.gradle/gradle.properties). The repo no longer carries credentials
    // or a keystore. See android-app/KEYSTORE_SETUP.md for the generation
    // + verification runbook.
    //
    //   Env vars (preferred for CI):
    //     HMS_UPLOAD_KEYSTORE_PATH   absolute path to .jks
    //     HMS_UPLOAD_KEYSTORE_PWD    keystore password
    //     HMS_UPLOAD_KEY_PWD         key (alias) password
    //
    //   Or in ~/.gradle/gradle.properties (preferred for local dev):
    //     hmsUploadKeystorePath=/absolute/path/hms-upload.jks
    //     hmsUploadKeystorePwd=...
    //     hmsUploadKeyPwd=...
    //
    // assembleRelease fails loudly if neither source is set.
    signingConfigs {
        release {
            def keystorePath = System.getenv("HMS_UPLOAD_KEYSTORE_PATH")
                ?: project.findProperty("hmsUploadKeystorePath")
            def keystorePwd = System.getenv("HMS_UPLOAD_KEYSTORE_PWD")
                ?: project.findProperty("hmsUploadKeystorePwd")
            def keyPwd = System.getenv("HMS_UPLOAD_KEY_PWD")
                ?: project.findProperty("hmsUploadKeyPwd")

            if (keystorePath && keystorePwd && keyPwd) {
                storeFile     file(keystorePath)
                storePassword keystorePwd
                keyAlias      "hms-upload"
                keyPassword   keyPwd
            }
            // If unset, this signingConfig has no storeFile. Gradle will
            // refuse `assembleRelease` with a clear "keystore not specified"
            // error — see KEYSTORE_SETUP.md.
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Production hits the live Render deployment.
            buildConfigField "String", "BASE_URL", "\"https://hospital-management-8lbf.onrender.com\""
        }
        debug {
            // Debug builds default to the same host today; switch to a staging
            // URL here once a separate staging deployment exists.
            buildConfigField "String", "BASE_URL", "\"https://hospital-management-8lbf.onrender.com\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    // Security
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.biometric:biometric:1.1.0"

    // Jetpack Compose
    def compose_version = '1.5.4'
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.material3:material3:1.1.2"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation "androidx.activity:activity-compose:1.8.1"
    implementation "androidx.navigation:navigation-compose:2.7.5"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2"
    implementation "androidx.compose.runtime:runtime-livedata:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // CameraX
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit Document Scanner
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Coil for image loading in Compose
    implementation "io.coil-kt:coil-compose:2.5.0"

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // PDF generation
    implementation 'com.itextpdf:itext7-core:7.2.5'

    // Accompanist (Compose utilities)
    implementation "com.google.accompanist:accompanist-permissions:0.32.0"

    // Shimmer loading effect
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Firebase BoM (32.x — last version compatible with Kotlin 1.9)
    implementation platform('com.google.firebase:firebase-bom:32.8.1')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Room Database (TD-A04 2026-04-25: kapt → KSP)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
}
